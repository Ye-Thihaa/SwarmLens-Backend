services:
  node1:
    build: .
    environment:
      NODE_ID: node1
      DB_PATH: /data/node1.db
      SELF_URL: http://node1:8000
      PEERS: http://node2:8000,http://node3:8000
      GOSSIP_INTERVAL: "1.0"
    ports: ["8001:8000"]
    volumes: ["./data:/data"]

  node2:
    build: .
    environment:
      NODE_ID: node2
      DB_PATH: /data/node2.db
      SELF_URL: http://node2:8000
      PEERS: http://node1:8000,http://node3:8000
      GOSSIP_INTERVAL: "1.0"
    ports: ["8002:8000"]
    volumes: ["./data:/data"]

  node3:
    build: .
    environment:
      NODE_ID: node3
      DB_PATH: /data/node3.db
      SELF_URL: http://node3:8000
      PEERS: http://node1:8000,http://node2:8000
      GOSSIP_INTERVAL: "1.0"
    ports: ["8003:8000"]
    volumes: ["./data:/data"]
